name: check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: test
        run: go test -count=1 ./...
      - name: specs
        run: npx --yes @fission-ai/openspec@2.1.1 validate --all --strict --no-interactive
